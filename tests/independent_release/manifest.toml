# tests/independent_release/manifest.toml
#
# The authoritative list of checks that must pass for the release gate to
# return status=PASS. Adding a check here makes it release-required.
# Removing a check requires a written justification in the commit message
# and a note in docs/RELEASE_MANIFEST_CHANGES.md.
#
# command substitutions:
#   {python} -> current interpreter
#   {root}   -> repository root
#
# kind:
#   pytest | command | python_module
#
# A missing executable/test/module is a MISSING check, not a pass.

# [release] is the single source of release identity. scripts/audit_release_status.py
# resolves the status document from `status_document` below -- it never scans docs/
# for the newest-sorting `*RELEASE_STATUS*.md` filename. Bumping the release means
# updating all three fields here together with creating the matching status document;
# leaving `status_document` pointed at a stale/historical file, or leaving `version`
# or `artifact_name` mismatched with that document's own declared header, is a
# release-blocking failure by design, not an oversight to be tolerated.
[release]
version = "32"
artifact_name = "Minded_AAOS_v32_2026-09-26_session17_question_resolution_release_gate_fix.zip"
status_document = "docs/AAOS_V32_RELEASE_STATUS.md"

[[check]]
id = "compileall"
description = "All Python source compiles"
kind = "command"
command = ["{python}", "-m", "compileall", "-q", "packages", "apps", "scripts", "tests"]
expected_exit_code = 0
production_path = false

[[check]]
id = "alembic_upgrade_head"
description = "Fresh empty database migrates to Alembic head with no errors"
kind = "python_module"
command = ["{python}", "-m", "scripts.gate_check_alembic_drift", "--upgrade-only"]
expected_exit_code = 0
production_path = true

[[check]]
id = "alembic_no_drift"
