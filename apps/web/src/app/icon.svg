<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian Jungle -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020904" />
      <stop offset="100%" stop-color="#05150a" />
    </linearGradient>

    <!-- Lattice Gold / Amber Gradient -->
    <linearGradient id="gold-lattice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>

    <!-- Core Intelligence Emerald Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Obsidian Shield with Gold Border -->
  <rect width="32" height="32" rx="7" fill="url(#bg-grad)" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.6"/>
  
  <!-- Outer Hexagonal Prism / Lattice -->
  <polygon points="16,4.5 26,10.2 26,21.8 16,27.5 6,21.8 6,10.2" 
           fill="#0a2212" 
           stroke="url(#gold-lattice)" 
           stroke-width="1.6" 
           stroke-linejoin="round"/>
           
  <!-- Internal Coordinate Axes / Lattice Struts -->
  <line x1="16" y1="4.5" x2="16" y2="27.5" stroke="url(#gold-lattice)" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="6" y1="10.2" x2="26" y2="21.8" stroke="url(#gold-lattice)" stroke-width="0.9" stroke-opacity="0.45"/>
  <line x1="6" y1="21.8" x2="26" y2="10.2" stroke="url(#gold-lattice)" stroke-width="0.9" stroke-opacity="0.45"/>
  
  <!-- Inner Analytical Diamond Frame -->
  <polygon points="16,9.5 21.5,16 16,22.5 10.5,16" 
           fill="rgba(212, 175, 55, 0.15)" 
           stroke="#D4AF37" 
           stroke-width="1" 
           stroke-opacity="0.75"/>
  
  <!-- Central Intelligence Core (Emerald Quantum Node) -->
  <circle cx="16" cy="16" r="3.2" fill="url(#core-glow)" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="1.1" fill="#FFFFFF"/>
</svg>
